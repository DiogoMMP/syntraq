<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Syntraq</title>
  <desc id="d">Syntraq — Power up your agents. Claude Code plugins: git-workflow, dev-tools, knowledge-base, study.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#161D3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="860" y1="0" x2="1180" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <circle cx="1010" cy="160" r="230" fill="url(#glow)"/>

  <!-- mark: a hexagon with a bolt -->
  <g transform="translate(88 104)">
    <path d="M56 0 L104.5 28 V84 L56 112 L7.5 84 V28 Z" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M62 22 L36 62 H54 L48 92 L76 50 H58 Z" fill="url(#accent)"/>
  </g>

  <text x="232" y="168" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="700" fill="#F5F7FF" letter-spacing="-1">Syntraq</text>
  <text x="236" y="214" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#A9B4D6">Power up your agents</text>

  <!-- plugin chips -->
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#DDE3FF">
    <rect x="236" y="240" width="122" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#7C5CFF" stroke-opacity="0.6"/>
    <text x="297" y="261" text-anchor="middle">git-workflow</text>
    <rect x="370" y="240" width="104" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#6A7CFF" stroke-opacity="0.6"/>
    <text x="422" y="261" text-anchor="middle">dev-tools</text>
    <rect x="486" y="240" width="148" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#4FA8F5" stroke-opacity="0.6"/>
    <text x="560" y="261" text-anchor="middle">knowledge-base</text>
    <rect x="646" y="240" width="76" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#22D3EE" stroke-opacity="0.6"/>
    <text x="684" y="261" text-anchor="middle">study</text>
  </g>

  <!-- agent network -->
  <g stroke="url(#line)" stroke-width="2" stroke-opacity="0.5" fill="none">
    <path d="M880 96 L1010 160 L1150 92"/>
    <path d="M880 230 L1010 160 L1160 236"/>
    <path d="M880 96 L880 230"/>
    <path d="M1150 92 L1160 236"/>
    <path d="M1010 160 L1010 58"/>
    <path d="M1010 160 L1010 270"/>
    <path d="M880 96 L1010 58 L1150 92"/>
    <path d="M880 230 L1010 270 L1160 236"/>
    <path d="M1150 92 L1220 160 L1160 236"/>
    <path d="M880 96 L810 160 L880 230"/>
  </g>
  <g stroke="url(#line)" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 6" fill="none">
    <path d="M810 160 L1010 160 L1220 160"/>
  </g>
  <g>
    <circle cx="1010" cy="160" r="28" fill="#0B1020" stroke="url(#line)" stroke-width="4"/>
    <path d="M1013 143 L1000 164 H1010 L1006 179 L1021 157 H1011 Z" fill="url(#line)"/>
    <circle cx="880" cy="96" r="10" fill="#7C5CFF"/>
    <circle cx="880" cy="230" r="10" fill="#6A6CFF"/>
    <circle cx="1150" cy="92" r="10" fill="#38BDF8"/>
    <circle cx="1160" cy="236" r="10" fill="#22D3EE"/>
    <circle cx="1010" cy="58" r="7" fill="#A78BFA"/>
    <circle cx="1010" cy="270" r="7" fill="#67E8F9"/>
    <circle cx="810" cy="160" r="6" fill="#8B7CFF"/>
    <circle cx="1220" cy="160" r="6" fill="#2DD4BF"/>
  </g>
</svg>
